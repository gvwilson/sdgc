project:
  type: book
  output-dir: docs

book:
  title: "SDGC"
  repo-url: "https://github.com/gvwilson/sdgc"
  repo-actions: [edit, source, issue]
  chapters:
    - index.qmd
    - 0-intro/index.qmd
    - 1-power/index.qmd
    - 2-markets/index.qmd
    - 3-thinking/index.qmd
    - 4-inequality/index.qmd
    - 5-belief/index.qmd
    - 6-regulation/index.qmd
    - 7-change/index.qmd
    - 8-finale/index.qmd
  appendices:
    - intro/index.qmd
    - a-little-psychology/index.qmd
    - how-we-got-here/index.qmd
    - more-psychology/index.qmd
    - harmful-models/index.qmd
    - privacy-power-self/index.qmd
    - inequality/index.qmd
    - more-analogies/index.qmd
    - control-and-alternatives/index.qmd
    - what-we-owe-the-future/index.qmd
    - regulation-that-worked/index.qmd
    - ai-happens/index.qmd
    - change-happens/index.qmd
    - finale/index.qmd
    - license/index.qmd
    - conduct/index.qmd
    - contributing/index.qmd
    - bibliography/index.qmd
    - glossary/index.qmd
    - workshop/index.qmd

bibliography: bibliography/references.bib
csl: mccole/book.csl

filters:
  - mccole/links.lua

shortcodes:
  - mccole/glossary.lua
  - mccole/inc-noh1.lua

format:
  html:
    css: mccole/book.css
    link-citations: true
    theme: cosmo
    toc: true
  pdf:
    documentclass: mccole/krantz
