project:
  type: book
  output-dir: docs

book:
  title: "SDGC"
  repo-url: "https://github.com/gvwilson/sdgc"
  repo-actions: [edit, source, issue]
  chapters:
    - index.qmd
    - 0-intro/index.qmd
    - 1-power/index.qmd
    - 2-markets/index.qmd
    - 3-thinking/index.qmd
    - 4-inequality/index.qmd
    - 5-belief/index.qmd
    - 6-regulation/index.qmd
    - 7-change/index.qmd
    - 8-finale/index.qmd
  appendices:
    - license/index.qmd
    - conduct/index.qmd
    - contributing/index.qmd
    - bibliography/index.qmd
    - glossary/index.qmd

bibliography: bibliography/references.bib
csl: mccole/book.csl

filters:
  - mccole/links.lua

shortcodes:
  - mccole/glossary.lua
  - mccole/inc-noh1.lua

format:
  html:
    css: mccole/book.css
    link-citations: true
    theme: cosmo
    toc: true
  pdf:
    documentclass: scrbook
